<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тыщавновых — HP</title><style>body{margin:0;background:transparent;font-family:system-ui,Arial,sans-serif;color:#f5e8df}.wrap{box-sizing:border-box;padding:18px;background:#251c24;border:3px solid #141015;border-radius:16px;max-width:760px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:900;letter-spacing:.03em}.hp{color:#ffb5b5;white-space:nowrap}.track{margin-top:13px;height:31px;background:#4a3942;border:3px solid #0d0a0d;border-radius:9px;overflow:hidden;box-shadow:3px 4px 0 #100c10}.fill{height:100%;width:100%;background:repeating-linear-gradient(125deg,#ed4047 0 17px,#d52c37 17px 25px);transition:width .35s}.foot{margin-top:10px;color:#bca8b2;font-size:12px}body.embed .foot{display:none}body.embed .wrap{max-width:none}</style></head><body><div class="wrap"><div class="head"><span>☠️ ТЫЩАВНОВЫХ</span><span class="hp" id="label">1500 / 1500 HP</span></div><div class="track"><div class="fill" id="fill"></div></div><div class="foot" id="status">Загрузка…</div></div><script>
// ВСТАВЬТЕ СЮДА URL JSON-ФАЙЛА С ПОЛЕМ hp, например {"hp":657}
const DATA_URL = 'health.json';
const params=new URLSearchParams(location.search);if(params.has('embed'))document.body.classList.add('embed');
async function update(){try{let response=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);let data=await response.json();let hp=Math.max(0,Math.min(1500,Number(data.hp)));if(!Number.isFinite(hp))throw Error('Неверное HP');document.getElementById('label').textContent=hp+' / 1500 HP';document.getElementById('fill').style.width=(hp/1500*100)+'%';document.getElementById('status').textContent=hp===0?'☠️ БОСС ПОВЕРЖЕН':'Обновлено';}catch(e){document.getElementById('status').textContent='Не удалось прочитать health.json';}}
update();setInterval(update,30000);
</script></body></html>
